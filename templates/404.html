{% extends "base.html" %}

{% block title %}Page introuvable | {{ portfolio.name }}{% endblock %}

{% block content %}
  <section class="section error-section">
    <div class="container error-content">
      <p class="section-kicker">Erreur 404</p>
      <h1>Cette page n'existe pas.</h1>
      <p>Le lien est peut-être incorrect ou la page a été déplacée.</p>
      <a class="button button-primary" href="{{ url_for('index') }}">Retour à l'accueil</a>
    </div>
  </section>
{% endblock %}
