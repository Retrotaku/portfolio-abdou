<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Portfolio professionnel d'Abdou Salifou, étudiant en Digitalisation des Services à l'EMSP, à Abidjan.">
    <meta name="theme-color" content="#0b1020">
    <title>{% block title %}{{ portfolio.site_title }}{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Aller au contenu</a>
    <header class="site-header">
      <div class="container nav-shell">
        <a class="brand" href="{{ url_for('index') }}" aria-label="Accueil — Abdou Salifou">
          <span class="brand-mark" aria-hidden="true">AS</span>
          <span>Abdou Salifou</span>
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
          <span class="sr-only">Ouvrir le menu</span>
          <span class="menu-lines" aria-hidden="true"></span>
        </button>
        <nav class="primary-nav" id="primary-navigation" aria-label="Navigation principale">
          <a href="{{ url_for('index') }}#accueil">Accueil</a>
          <a href="{{ url_for('index') }}#a-propos">À propos</a>
          <a href="{{ url_for('index') }}#competences">Compétences</a>
          <a href="{{ url_for('index') }}#projets">Projets</a>
          <a href="{{ url_for('index') }}#formation">Formation</a>
          <a href="{{ url_for('index') }}#contact">Contact</a>
          {% if cv_available %}
            <a class="nav-cv" href="{{ url_for('static', filename='files/cv-abdou-salifou.pdf') }}" target="_blank" rel="noopener noreferrer">CV</a>
          {% endif %}
          <button class="theme-toggle" type="button" aria-label="Activer le thème clair" title="Changer de thème">
            <span class="theme-icon" aria-hidden="true">☼</span>
          </button>
        </nav>
      </div>
    </header>

    <main id="main-content">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© <span data-current-year></span> Abdou Salifou</p>
        <a href="{{ url_for('index') }}#accueil">Retour en haut ↑</a>
      </div>
    </footer>
  </body>
</html>
